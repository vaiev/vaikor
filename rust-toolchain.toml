# cedar-policy 4.13 needs rustc >= 1.89. The pin follows stable and is raised deliberately (docs/ROADMAP.md, track A).
[toolchain]
channel = "1.97.0"
components = ["clippy", "rustfmt"]
# validate.yml "static musl binary" job and the arm64 container image build for these targets.
targets = ["x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]
profile = "minimal"
